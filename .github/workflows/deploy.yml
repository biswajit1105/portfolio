
name: Deploy Portfolio

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      # Step 1: Get your GitHub repository code
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Install Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Build React + Vite project
      - name: Build project
        run: npm run build

      # Step 5: Upload generated website
      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # Step 6: Deploy website to GitHub Pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
